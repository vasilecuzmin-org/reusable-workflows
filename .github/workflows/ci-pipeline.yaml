name: reusable-workflow
on:
  workflow_call:
    inputs:
      run_unit_tests:
        description: "Run unit tests"
        required: false
        type: boolean
        default: true
      run_sonarqube:
        description: "Run SonarQube analysis"
        required: false
        type: boolean
        default: true
      run_build:
        description: "Create Docker image"
        required: false
        type: boolean
        default: true
      run_codeql:
        description: "Run CodeQL analysis"
        required: false
        type: boolean
        default: true
      run sonarqube:
        description: "Run SonarQube analysis"
        required: false
        type: boolean
        default: true
      run_publish_ghcr:
        description: "Publish Docker image to GitHub Container Registry"
        required: false
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: true
      DOCKER_USERNAME:
        required: false
      DOCKER_TOKEN:
        required: false

env:
  ENV_TYPE: dev
  APP_USER: cuzminv
  APP_PORT: 8080

jobs:
  job1:
    name: Job1
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: checkout
        uses: actions/checkout@v6.1.0
      - name: Step 2
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> ./artifacts/list.txt
          echo `hostname` >> ./artifacts/hostname.txt
      - name: Upload artifacts folder
        uses: actions/upload-artifact@v4.4.3
        with:
          name: myartifact
          path: ./artifacts/*
      - name: upload from multiple paths
        uses: actions/upload-artifact@v4.4.3
        with:
          name: multiple-paths
          path: |
            ./myartifact.txt 
            ./artifacts/*
      - name: upload from multiple paths with exclusions
        uses: actions/upload-artifact@v4.4.3
        with:
          name: multiple-paths-with-exclusions
          path: |
            ./myartifact.txt 
            ./artifacts/*
            !**/hostname.txt
      - name: referring env vars
        run: |
          echo $ENV_TYPE
          echo $APP_USER
          echo $APP_PORT
      - name: repository secrets
        run: |
          echo ${{ secrets.APP_PASS }}
  job2:
    name: Job2
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: checking current directory
        run: pwd && ls -ltr
      - name: Download artifacts from job1
        uses: actions/download-artifact@v8
        with:
          name: myartifact
      - name: checking current directory post download
        run: pwd && ls -ltr
      - name: Successful completion of job2
        run: exit 0
  job3:
    name: Job3
    needs: job1
    runs-on: ubuntu-latest
    steps:
      - name: creating custom folder for download
        run: mkdir -p ./custom-folder
      - name: checking current directory
        run: pwd && ls -ltr
      - name: Download artifacts from job1 inside custom folder
        uses: actions/download-artifact@v8
        with:
          name: myartifact
          path: ./custom-folder
      - name: checking current directory post download
        run: pwd && ls -ltr ./custom-folder
  job4:
    name: Job4
    runs-on: ubuntu-latest
    steps:
      - name: referring context or built-in env vars
        run: |
          echo "triggerd by event: ${{ github.event_name }}"
          echo "triggerd by workflow: ${{ github.workflow }}"
          echo "triggerd by action: ${{ github.action }}"
          echo "new changes pushed to branch: ${{ github.ref }}"
          echo "changes added by user: ${{ github.actor }} in ${{ github.head_ref }} branch"
  unit-tests:
    if: ${{ inputs.run_unit_tests }}
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: |
          mkdir reports/
          pytest --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: Upload test results
        uses: actions/upload-artifact@v4.4.3
        with:
          name: unit-test-report
          path: reports/

  staging:
    name: Staging
    runs-on: ubuntu-latest
    environment:
      name: stg
    if: github.head_ref == 'dev'
    steps:
      - name: referring env vars and secrets
        run: |
          echo "running deployment on $ {{ vars.HOST }} using user $ {{ secrets.USER }}"
  production:
    name: Production
    runs-on: ubuntu-latest
    environment:
      name: prod
    if: github.ref == 'refs/heads/main'
    steps:
      - name: referring env vars and secrets
        run: |
          echo "running deployment on $ {{ vars.HOST }} using user $ {{ secrets.USER }}"

  codeql:
    if: ${{ inputs.run_codeql }}
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read #lets the job read information about Actions itself, such as workflow runs and the workflow files. The comment in your snippet is a bit misleading, because the token doesn’t just open files. CodeQL’s action uses this permission to look up details about the current workflow run through the API, and it’s needed in private repos. It also lets CodeQL analyze the workflow files themselves, since it can scan GitHub Actions workflows for security issues.
      contents: read #lets the job check out your repository code.
      security-events:
        write #lets the job upload scan results to the repository’s Security tab (code scanning alerts).
        #Required for uploading SARIF file. What is the SARIF file?
      # SARIF is a standard format for the output of static analysis tools. It allows the results of different tools to be aggregated and viewed in a consistent way.
    strategy:
      matrix: #Required for CodeQL analysis.
        #The matrix defines the different configurations that the job will run.
        #In this case, the matrix is defined with a single language, Python.
        language: ["python"]
      #A strategy matrix allows you to define multiple configurations for a job, and GitHub Actions will run the job for each configuration. In this case, the matrix is defined with a single language
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}-security"
  sonarqube:
    if: ${{ inputs.run_sonarqube }}
    name: SonarQube
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: unit-test-report
          path: reports/
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonaQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  build:
    if: ${{ success() && inputs.run_build }}
    name: Build
    runs-on: ubuntu-latest
    # needs: [unit-tests, codeql, sonarqube] - This is commented because if any of these jobs fail,
    # build will not run. So, we are only keeping unit-tests as a dependency.
    needs: [unit-tests]
    outputs:
      IMAGE_TAGS: ${{ steps.generate_tags.outputs.IMAGE_TAGS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Generate Image tags
        id: generate_tags
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${{ github.run_number }}-${{ github.sha }}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
      - name: Build and upload Docker image
        uses: docker/build-push-action@v3.0.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ghcr.io/vasilecuzmin/my-first-python-app:${{ steps.generate_tags.outputs.IMAGE_TAGS }}
          load: true
      - name: Save Docker Image
        run: |
          docker save ghcr.io/vasilecuzmin/my-first-python-app:${{ steps.generate_tags.outputs.IMAGE_TAGS  }} -o my-first-python-app.tar
      - name: Upload Docker Image
        uses: actions/upload-artifact@v4.4.3
        with:
          name: python-app-docker-image
          path: my-first-python-app.tar

  publish-ghcr:
    if: ${{ success() && inputs.run_publish_ghcr }}
    name: Publish Docker Image to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read # lets the job check out your repository code.
      packages: write # lets the job publish packages to GitHub Packages (GHCR).
      #what does env does?
      #The `env` keyword in a GitHub Actions workflow is used to define environment variables that can be accessed by all steps within a job. In this case, the `IMAGE` environment variable is being set to the value of the Docker image tag generated in the `build` job. This allows subsequent steps in the `publish-ghcr` job to reference the Docker image tag easily without having to repeat the logic for generating it.
    env:
      IMAGE: ghcr.io/vasilecuzmin/my-first-python-app:${{ needs.build.outputs.IMAGE_TAGS }}
    steps:
      - name: Download Docker Image artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: python-app-docker-image
          path: .
      - name: Load Docker Image
        run: |
          docker load -i my-first-python-app.tar
      - name: Login to GHCR
        uses: docker/login-action@v3.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} #GITHUB_TOKEN is a default secret provided by GitHub.
          # It is automatically generated for each workflow run and has read and write permissions to the repository where the workflow is running. It can be used to authenticate with the GitHub API and perform actions such as creating issues, commenting on pull requests, and pushing code to the repository.
      - name: Push image to GHCR
        run: |
          docker push ""${{ env.IMAGE }}
